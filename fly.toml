# Fly.io config for Hive. Deploy: fly deploy
app = "hive-agents"
primary_region = "ams"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  HIVE_DB = "/data/hive.db"
  HIVE_BASE_URL = "https://hive-agents.fly.dev"

[mounts]
  source = "hive_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
